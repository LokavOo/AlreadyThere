<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>观者自在</title>
<style>
:root{--bg:#f4f3ef;--side:#ebe9e3;--card:#ffffff;--ink:#23231f;--mute:#85847c;--line:#dcdad2;--acc:#3f6f9f;
--ok:#2f8a57;--warn:#b7791f;--bad:#c2463d;--c0:#3f6f9f;--c1:#8a5a9e;--c2:#2f8a78;--c3:#b0643a;--c4:#5a6f2f}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b19;--side:#232320;--card:#2b2b28;--ink:#ecebe6;--mute:#9d9c95;--line:#3a3935;
--acc:#7fb0e0;--ok:#6cc08b;--warn:#e0a44a;--bad:#ef7b72;--c0:#7fb0e0;--c1:#c39ad6;--c2:#6cc8b4;--c3:#e39a6e;--c4:#a8c07a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;display:flex}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.45;cursor:default}
aside{width:270px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand{padding:18px 18px 10px}.brand b{font-size:18px}.brand small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.sec{padding:8px 12px 12px}.sec h3{font-size:12px;color:var(--mute);font-weight:600;margin:6px 6px 8px;letter-spacing:.05em}
.proj{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.proj:hover{background:var(--line)}.proj.sel{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pill{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.run{color:var(--acc);border-color:var(--acc)}.pill.done{color:var(--ok);border-color:var(--ok)}
.role{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}.dot.on{background:var(--ok)}
.role span.m{color:var(--mute);font-size:12px;margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
#pingout{font-size:12px;color:var(--mute);white-space:pre-wrap;margin:8px 6px 0;max-height:160px;overflow:auto}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h2{margin:0;font-size:16px}header .q{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chat{flex:1;overflow:auto;padding:16px 20px 24px}
.msg{display:flex;gap:10px;margin:10px 0;max-width:820px}
.av{width:34px;height:34px;border-radius:50%;flex:none;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.who{font-size:12px;color:var(--mute);margin-bottom:3px}.who b{color:var(--ink);font-weight:600;margin-right:6px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 12px;white-space:pre-wrap;word-break:break-word}
.bub.ok{border-left:3px solid var(--ok)}.bub.bad{border-left:3px solid var(--bad)}.bub.op{border-left:3px solid var(--warn)}
.chk{font-size:12px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.chk.y{color:var(--ok)}.chk.n{color:var(--bad);font-weight:600}.chk.u{color:var(--mute)}
.note{text-align:center;color:var(--mute);font-size:12px;margin:6px 0}
.note.warn{color:var(--warn)}
.quiet{color:var(--mute);font-size:12px;margin:2px 0 2px 44px}
.divider{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12px;margin:18px 0 10px}
.divider:before,.divider:after{content:"";flex:1;border-top:1px solid var(--line)}
.banner{text-align:center;margin:14px 0}.banner span{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;font-size:13px}
.empty{color:var(--mute);text-align:center;margin-top:18vh;line-height:2}
footer{border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;background:var(--bg)}
footer .hint{color:var(--mute);font-size:12px;margin-left:auto}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
.mask.show{display:flex}
.dlg{background:var(--card);border-radius:12px;padding:20px;width:min(560px,92vw);max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg.wide{width:min(980px,94vw)}
.dlg h3{margin:0 0 12px}.dlg label{display:block;margin:10px 0 4px;color:var(--mute);font-size:12px}
.dlg select,.dlg input{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err{color:var(--bad);font-size:13px;margin-top:8px;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:13px}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}td:nth-child(-n+6),th{white-space:nowrap}th{background:var(--bg)}
.md h1{font-size:17px}.md h2{font-size:15px;margin-top:18px}
.alert{margin:10px auto;max-width:820px;border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card));color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600;white-space:pre-wrap}
#trustWarn{display:none;border-top:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg));color:var(--bad);padding:8px 20px;font-size:13px;font-weight:600}
.mrow{padding:6px;border-radius:8px;margin-bottom:4px}.mrow.dirty{background:var(--card)}
.mh{font-size:13px;display:flex;gap:6px;align-items:center;margin-bottom:3px}
.mrow select,.mrow input[type=number]{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.mrow select{width:100%}.mrow input[type=number]{width:52px}
.mfix{font-size:12px;color:var(--mute);margin-top:4px;line-height:2}.mfix label{margin-right:8px;white-space:nowrap}
.mdesc{font-size:11px;color:var(--mute);margin-top:2px}
#memMsg{font-size:12px;margin:6px 6px 0;white-space:pre-wrap}
pre.log{white-space:pre-wrap;font-size:12px;color:var(--mute);background:var(--bg);padding:8px;border-radius:8px;max-height:200px;overflow:auto}
</style></head><body>
<aside>
  <div class="brand"><b>观者自在</b><small>AlreadyThere · 原型第一期</small></div>
  <div class="sec"><h3>项目</h3><div id="projs"></div>
    <button id="btnNew" style="width:100%;margin-top:8px">＋ 新建项目</button></div>
  <div class="sec"><h3>准备情况</h3><div id="roles"></div>
    <button id="btnPing" style="width:100%;margin-top:8px">连通测试</button><div id="pingout"></div></div>
  <div class="sec"><h3>记忆模式（运行前选好）</h3><div id="mem"></div>
    <button id="btnMem" style="width:100%;margin-top:6px" disabled>保存记忆模式</button><div id="memMsg"></div></div>
</aside>
<main>
  <header><div style="min-width:0"><h2 id="title">未选择项目</h2><div class="q" id="question"></div></div>
    <span class="pill" id="status" style="margin-left:auto;display:none"></span></header>
  <div id="chat"><div class="empty">左边选一个项目，就能看到几个模型的对质过程。<br>还没有项目的话，点「＋ 新建项目」。</div></div>
  <div id="trustWarn">⚠ 这个项目的题目文件里没有可信网站名单（trusted_sites）：审查者的独立核验不会启动，任何条目都不可能判为"查到"。如果不是有意这样，请换用带名单的题目文件（如 明清皇帝生肖.json）新建项目。</div>
  <footer>
    <button class="primary" id="btnRun" disabled>开始运行</button>
    <button id="btnCon" disabled>看结论</button>
    <button id="btnDetail" disabled>详细记录</button>
    <span class="hint" id="hint"></span>
  </footer>
</main>
<div class="mask" id="mNew"><div class="dlg"><h3>新建项目</h3>
  <label>题目</label><select id="qsel"></select>
  <div class="err" id="qwarn"></div>
  <label>项目名字</label><input id="pname" maxlength="60">
  <div class="err" id="newErr"></div>
  <div class="row"><button onclick="hide('mNew')">取消</button><button class="primary" id="btnCreate">创建</button></div></div></div>
<div class="mask" id="mCon"><div class="dlg wide"><h3 id="conTitle">结论</h3><div class="md" id="conBody"></div>
  <div class="row"><button onclick="hide('mCon')">关闭</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
let S={}, cur=null, last=0, lastRound=null, colors={}, running=false, question={}, trusted=true, memDirty=false;
const pal=['--c0','--c1','--c2','--c3','--c4'];
function color(role){if(role==='程序')return 'var(--mute)';if(role==='用户')return 'var(--ink)';
  if(!(role in colors))colors[role]=pal[Object.keys(colors).length%pal.length];return 'var('+colors[role]+')'}
function esc(s){return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function get(u){const r=await fetch(u);return r.json()}
async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json','X-Guanzhe':'1'},body:JSON.stringify(b||{})});return r.json()}
function show(id){$(id).classList.add('show')} function hide(id){$(id).classList.remove('show')}

async function refresh(){
  try{S=await get('/api/state')}catch(e){return}
  const R=$('roles');
  if(S.error){R.innerHTML='<div class="err">'+esc(S.error)+'</div>'}
  else{R.innerHTML=S.roles.map(r=>`<div class="role" title="${esc(r.model)}"><span class="dot ${r.key?'on':''}"></span>${esc(r.name)}<span class="pill">${esc(r.kind)}</span><span class="m">${esc(r.model)}</span></div>`).join('')
    +`<div class="role"><span class="dot ${S.search_key?'on':''}"></span>检索（Tavily）</div>`
    +(S.secrets_file?'':'<div class="err">还没有 密钥.env 文件（放在数据文件夹里）</div>')
    +(S.data_dir?`<div class="quiet" style="margin:6px 6px 0;word-break:break-all">数据文件夹：${esc(S.data_dir)}</div>`:'')
    +(S.moved&&S.moved.length?`<div class="quiet" style="margin:4px 6px 0;color:var(--ok)">已从旧版本复制过来：${esc(S.moved.join('；'))}（原处未删除）</div>`:'')}
  if(!memDirty)renderMem();
  $('projs').innerHTML=S.projects.length?S.projects.map(p=>`<div class="proj ${p.name===cur?'sel':''}" data-n="${esc(p.name)}"><span>${esc(p.name)}</span>`+
    (p.running?'<span class="pill run">运行中</span>':p.done?'<span class="pill done">已完成</span>':'<span class="pill">未完成</span>')+'</div>').join('')
    :'<div class="quiet" style="margin:0 6px">还没有项目</div>';
  document.querySelectorAll('.proj').forEach(el=>el.onclick=()=>select(el.dataset.n));
  $('btnPing').disabled=S.ping.running;
  $('pingout').textContent=S.ping.lines.join('\n');
  const p=S.projects.find(x=>x.name===cur);
  if(p){running=p.running;$('status').style.display='';$('status').className='pill '+(p.running?'run':p.done?'done':'');
    $('status').textContent=p.running?'运行中':p.done?'已完成':'未完成';
    $('btnRun').disabled=p.running;$('btnRun').textContent=p.running?'运行中…':(p.done?'再运行一次':last>2?'继续运行':'开始运行');
    $('btnCon').disabled=!p.done;$('btnDetail').disabled=false;
    const miss=(S.roles||[]).filter(r=>!r.key).map(r=>r.name);if(!S.search_key)miss.push('Tavily');
    $('hint').textContent=p.running?'运行中，可以关掉窗口，不会打断；重新打开能接着看。':miss.length?'密钥还没填全：'+miss.join('、'):'';}
}
async function select(n){cur=n;trusted=true;$('trustWarn').style.display='none';last=0;lastRound=null;colors={};$('chat').innerHTML='';$('title').textContent=n;
  $('question').textContent='';refresh();pull()}
function atBottom(){const c=$('chat');return c.scrollHeight-c.scrollTop-c.clientHeight<80}
function add(m){
  const c=$('chat');let h='';
  if(m.round!=null&&m.round!==lastRound){lastRound=m.round;h+=`<div class="divider">第 ${m.round} 轮</div>`}
  if(m.kind==='alert')h+=`<div class="alert">⚠ ${esc(m.text)}</div>`;
  else if(m.kind==='banner')h+=`<div class="banner"><span>${esc(m.text)}</span></div>`;
  else if(m.kind==='system'||m.kind==='warn'&&m.role==='程序')h+=`<div class="note ${m.kind==='warn'?'warn':''}">${esc(m.text)}</div>`;
  else if(m.kind==='quiet')h+=`<div class="quiet">${esc(m.speaker)} · ${esc(m.text)}</div>`;
  else{
    const cls=m.kind==='review_ok'?'ok':m.kind==='review_bad'||m.kind==='warn'?'bad':m.kind==='opinion'?'op':'';
    let chk='';if(m.check){const k=m.check.ok===true?'y':m.check.ok===false?'n':'u';
      chk=`<div class="chk ${k}">${k==='y'?'✓ ':k==='n'?'⚠ 程序拦下：':'· '}${esc(m.check.text)}</div>`}
    h+=`<div class="msg"><div class="av" style="background:${color(m.role)}">${esc((m.speaker||'?')[0])}</div><div style="min-width:0">
      <div class="who"><b>${esc(m.speaker)}</b>${m.tag?esc(m.tag):''}</div><div class="bub ${cls}">${esc(m.text)}${chk}</div></div></div>`}
  c.insertAdjacentHTML('beforeend',h)}
async function pull(){
  if(!cur)return;const n=cur;
  let r;try{r=await get('/api/feed?p='+encodeURIComponent(n)+'&after='+last)}catch(e){return}
  if(n!==cur)return;
  const stick=atBottom()||last===0;
  if(last===0&&!r.messages.length)$('chat').innerHTML='<div class="empty">这个项目还没开始。点下方「开始运行」。</div>';
  else if(last===0)$('chat').innerHTML='';
  trusted=r.trusted!==false;$('trustWarn').style.display=trusted?'none':'block';
  if(r.question)$('question').textContent=r.question;r.messages.forEach(add);last=r.last;
  const pj=(S.projects||[]).find(x=>x.name===n);if(!r.running&&r.log&&pj&&!pj.done&&!$('logbox')){
    $('chat').insertAdjacentHTML('beforeend','<div class="note warn">上次运行停在这里，下面是它最后的输出（看不懂就截图给 Claude）：</div><pre class="log" id="logbox">'+esc(r.log.slice(-1500))+'</pre>')}
  if(stick)$('chat').scrollTop=$('chat').scrollHeight}
$('btnNew').onclick=()=>{const q=S.questions||[];
  $('qsel').innerHTML=q.map(x=>`<option value="${esc(x.file)}">${esc(x.question)}（${x.count} 条）</option>`).join('')+'<option value="__demo__">演示（虚构数据，不联网、不花钱）</option>';
  const setName=()=>{const v=$('qsel').value;$('pname').value=v==='__demo__'?'演示项目':v.replace(/\.json$/,'')+'项目'};
  const warnQ=()=>{const x=q.find(y=>y.file===$('qsel').value);
    $('qwarn').textContent=x&&!x.trusted?'⚠ 这个题目文件没有可信网站名单（trusted_sites）：独立核验不会启动，任何条目都判不成"查到"。':''};
  $('qsel').onchange=()=>{setName();warnQ()};setName();warnQ();$('newErr').textContent='';show('mNew')};
$('btnCreate').onclick=async()=>{$('btnCreate').disabled=true;$('newErr').textContent='正在创建…';
  const r=await post('/api/new',{name:$('pname').value.trim(),question:$('qsel').value});$('btnCreate').disabled=false;
  if(!r.ok){$('newErr').textContent=r.msg;return}hide('mNew');await refresh();select(r.name)};
$('btnPing').onclick=async()=>{await post('/api/ping');refresh()};
$('btnRun').onclick=async()=>{if(!cur)return;
  if(!trusted&&!confirm('这个项目没有可信网站名单：独立核验不会启动，任何条目都判不成"查到"。\n\n确定仍要运行吗？'))return;
  if(memDirty){const ok=await saveMem();if(!ok)return}
  $('btnRun').disabled=true;const r=await post('/api/run',{name:cur});
  if(!r.ok)alert(r.msg);document.getElementById('logbox')?.remove();refresh()};
$('btnCon').onclick=async()=>{const r=await get('/api/conclusion?p='+encodeURIComponent(cur));
  $('conTitle').textContent='结论 · '+cur;$('conBody').innerHTML=r.text?md(r.text):'还没有结论。';show('mCon')};
$('btnDetail').onclick=async()=>{const r=await post('/api/detail',{name:cur});if(r.ok)setTimeout(()=>window.open(r.url,'_blank'),900)};
// 1.5：在窗口里选记忆模式，由程序写回 设置.json
const MEMDESC={'全局':'看得到所有生产者之前的结果和意见原文','固定':'只看下面勾选的角色、最近几轮','全新':'每轮从头开始；意见里不含对方的数值和出处'};
function renderMem(){
  const M=$('mem');if(S.error||!S.roles||!S.roles.length){M.innerHTML='<div class="quiet" style="margin:0 6px">设置文件读不出来，暂时不能选</div>';return}
  const prods=S.roles.filter(r=>r.kind==='生产者');
  M.innerHTML=S.roles.map(r=>{const m=r.memory||{};const isP=r.kind==='生产者';
    const modes=isP?['全局','固定','全新']:['全局','全新'];const mode=modes.includes(m.mode)?m.mode:modes[0];
    const see=m.see||['self'];
    const boxes=isP?[['self','自己']].concat(prods.filter(x=>x.role!==r.role).map(x=>[x.role,x.name])).map(([v,t])=>
      `<label><input type="checkbox" value="${esc(v)}" ${see.includes(v)?'checked':''}> ${esc(t)}</label>`).join(''):'';
    return `<div class="mrow" data-r="${esc(r.role)}"><div class="mh">${esc(r.name)}<span class="pill">${esc(r.kind)}</span></div>
      <select class="mmode">${modes.map(x=>`<option ${x===mode?'selected':''}>${x}</option>`).join('')}</select>
      <div class="mdesc">${esc(MEMDESC[mode])}</div>
      ${isP?`<div class="mfix" style="display:${mode==='固定'?'block':'none'}">看：${boxes}<br>最近 <input type="number" class="mrounds" min="1" max="${S.max_rounds||6}" value="${esc(m.rounds||1)}"> 轮</div>`:''}
      ${m.bad?'<div class="err">设置.json 里这一项写得不对，保存后会改正</div>':''}</div>`}).join('');
  M.querySelectorAll('.mrow').forEach(row=>{
    const onchg=()=>{memDirty=true;row.classList.add('dirty');$('btnMem').disabled=false;$('memMsg').style.color='var(--warn)';
      $('memMsg').textContent='改了还没保存。点「保存记忆模式」，或者直接点「开始运行」会先自动保存。';
      const mode=row.querySelector('.mmode').value;row.querySelector('.mdesc').textContent=MEMDESC[mode];
      const fx=row.querySelector('.mfix');if(fx)fx.style.display=mode==='固定'?'block':'none'};
    row.querySelectorAll('select,input').forEach(el=>el.onchange=onchg)});
  $('btnMem').disabled=true}
async function saveMem(){
  const roles={};document.querySelectorAll('#mem .mrow').forEach(row=>{const mode=row.querySelector('.mmode').value;const m={mode};
    if(mode==='固定'){m.see=[...row.querySelectorAll('.mfix input[type=checkbox]:checked')].map(x=>x.value);
      m.rounds=parseInt(row.querySelector('.mrounds').value||'0',10)}
    roles[row.dataset.r]=m});
  $('btnMem').disabled=true;let r;try{r=await post('/api/memory',{roles})}catch(e){r={ok:false,msg:'没连上程序：'+e}}
  $('memMsg').style.color=r.ok?'var(--ok)':'var(--bad)';$('memMsg').textContent=r.msg||'';
  if(!r.ok){$('btnMem').disabled=false;return false}
  memDirty=false;await refresh();return true}
$('btnMem').onclick=saveMem;
function md(t){const L=t.split('\n');let h='',i=0;
  while(i<L.length){const l=L[i];
    if(l.startsWith('|')){const rows=[];while(i<L.length&&L[i].startsWith('|')){rows.push(L[i]);i++}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      h+='<table><tr>'+cells(rows[0]).map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';continue}
    if(l.startsWith('## '))h+='<h2>'+esc(l.slice(3))+'</h2>';else if(l.startsWith('# '))h+='<h1>'+esc(l.slice(2))+'</h1>';
    else if(l.startsWith('- '))h+='<div>• '+esc(l.slice(2))+'</div>';else if(l.trim())h+='<p>'+esc(l)+'</p>';i++}
  return h}
